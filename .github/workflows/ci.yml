name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10.9 hits an arborist bug (edgesOut) on this peer graph.
      - run: npm ci --legacy-peer-deps

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

      # Non-blocking baseline: the repository has pre-existing formatting debt.
      - run: npm run lint
        continue-on-error: true

      # Visibility only until the dependency baseline is triaged.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
